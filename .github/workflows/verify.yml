name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Exercise Windows line-ending conversion
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check shared contracts in sync
        run: python scripts/sync-shared.py --check

      - name: Check isolated skill resources
        run: python -B scripts/test_runtime_resources.py

      - name: Refactor harness tests
        run: python -B -m unittest discover -s repo-native-refactor/evals/tests -v

      - name: Foundation harness tests
        run: python -B -m unittest discover -s repo-foundation/evals/tests -v

      - name: Validate foundation assets
        run: python -B repo-foundation/evals/harness.py validate

      - name: Verify archived evidence
        shell: pwsh
        run: ./scripts/verify-archive.ps1

      - name: Verify PowerShell installer and rollback
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Verify runtime package generator
        shell: pwsh
        run: ./scripts/test-package.ps1

      - name: Verify skill demo acceptance suite
        shell: pwsh
        run: ./scripts/test-demos.ps1

      - name: CP2 treatment
        run: python -B repo-foundation/evals/harness.py verify CP2_SLICE evals-suite/ablation_cp2/treatment/workspace

      - name: CP3 treatment
        run: python -B repo-foundation/evals/harness.py verify CP3_EVOLUTION evals-suite/ablation_cp3_hardcore/treatment/workspace

      - name: CP4 continuity
        run: python -B repo-foundation/evals/harness.py verify CP4_CONTINUITY evals-suite/gate3_space_bunny/gate3-manual-v2-A-rep01

  linux-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check shared contracts in sync
        run: python scripts/sync-shared.py --check
      - name: Check isolated skill resources
        run: python -B scripts/test_runtime_resources.py
      - name: Refactor harness tests
        run: python -B -m unittest discover -s repo-native-refactor/evals/tests -v
      - name: Foundation harness tests
        run: python -B -m unittest discover -s repo-foundation/evals/tests -v
      - name: Validate foundation assets
        run: python -B repo-foundation/evals/harness.py validate
